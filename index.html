<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Breadfast CX Knowledge Base</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%235b8cff'/%3E%3Cstop offset='1' stop-color='%232554c7'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='16' fill='%2312151b'/%3E%3Crect x='6' y='6' width='52' height='52' rx='13' fill='url(%23g)'/%3E%3Ctext x='32' y='42' font-family='Arial, sans-serif' font-weight='800' font-size='26' fill='%23ffffff' text-anchor='middle'%3ECX%3C/text%3E%3C/svg%3E">
<style>
  :root{
    --bg:#f3f4f7;
    --panel:#ffffff;
    --panel-2:#f0f1f5;
    --line:#dde1e8;
    --text:#1b2028;
    --muted:#5b6472;
    --muted-2:#8891a0;
    --accent:#7c5cff;
    --accent-dim:#ece7ff;
    --accent-contrast:#4a3b8c;
    --red:#d92d3c;
    --red-dim:#fbe4e5;
    --green:#158a5a;
    --yellow:#b5820a;
    --grey:#8b95a3;
    --scrollbar-thumb:#c7cdd6;
    --refund-bg:#eaf1ff;
    --refund-border:#b9d0fb;
    --refund-label:#2554c7;
    --comp-bg:#e8f8f0;
    --comp-border:#b8e8cf;
    --comp-glow:rgba(21,138,90,.55);
    --comp-comet:#16a34a;
    --btn-primary-text:#ffffff;
    --btn-primary-hover:#6a4ce0;
    --shadow:0 24px 70px rgba(20,24,32,.18);
    --mono: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
    --sans: -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --arabic: "Segoe UI", Tahoma, "Arial", sans-serif;
    --radius: 10px;
  }
  html[data-theme="dark"]{
    --bg:#12151b;
    --panel:#181c24;
    --panel-2:#1e232c;
    --line:#2a313d;
    --text:#e8ecf1;
    --muted:#8891a0;
    --muted-2:#5b6472;
    --accent:#8b6cff;
    --accent-dim:#4a3b8c;
    --accent-contrast:#e2d9ff;
    --red:#ff5a5f;
    --red-dim:#4a2426;
    --green:#3dd68c;
    --yellow:#ffd166;
    --grey:#6b7280;
    --scrollbar-thumb:#2f3641;
    --refund-bg:#152238;
    --refund-border:#2c4a7a;
    --refund-label:#5b8cff;
    --comp-bg:#132b26;
    --comp-border:#1f5449;
    --comp-glow:rgba(61,214,140,.65);
    --comp-comet:#4ade80;
    --btn-primary-text:#fff;
    --btn-primary-hover:#7aa5ff;
    --shadow:0 24px 70px rgba(0,0,0,.55);
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:var(--sans); font-size:14px; line-height:1.5;
    overflow:hidden; transition:background .15s ease, color .15s ease;
  }
  ::selection{background:var(--accent-dim); color:var(--accent-contrast);}
  button{font-family:inherit; cursor:pointer;}
  input,select,button{font-size:inherit; color:inherit;}
  ::-webkit-scrollbar{width:9px; height:9px;}
  ::-webkit-scrollbar-thumb{background:var(--scrollbar-thumb); border-radius:6px;}
  ::-webkit-scrollbar-track{background:transparent;}

  .app{ display:flex; flex-direction:column; height:100vh; }
  #root{ display:flex; flex-direction:column; height:100vh; }

  /* ---------- Top bar ---------- */
  .topbar{
    display:flex; align-items:center; gap:14px;
    padding:12px 18px; border-bottom:1px solid var(--line);
    background:var(--panel); flex-shrink:0;
    transition:background .15s ease, border-color .15s ease;
  }
  .brand{ display:flex; align-items:center; gap:9px; margin-inline-end:6px; }
  .brand-mark{
    width:26px; height:26px; border-radius:7px;
    background:linear-gradient(135deg, #5b8cff, #2554c7);
    display:flex; align-items:center; justify-content:center;
    font-weight:800; font-size:13px; color:#fff; flex-shrink:0;
  }
  .brand-text{ display:flex; flex-direction:column; line-height:1.15; }
  .brand-text b{ font-size:13.5px; letter-spacing:.2px; }
  .brand-text span{ font-size:10.5px; color:var(--muted-2); font-family:var(--mono); letter-spacing:.4px;}

  .search-wrap{ flex:1; display:flex; align-items:center; gap:8px; max-width:720px; }
  .search-box{
    flex:1; display:flex; align-items:stretch; gap:10px;
    background:var(--panel-2); border:1px solid var(--line); border-radius:11px;
    padding:22px 16px; transition:border-color .15s; cursor:text;
  }
  .search-box:focus-within{ border-color:var(--accent); }
  .search-box svg{ flex-shrink:0; opacity:.6; align-self:center; width:17px; height:17px; }
  .search-box input{
    flex:1; width:100%; background:none; border:none; outline:none; color:var(--text); font-size:15.5px;
  }
  .search-box input::placeholder{ color:var(--muted-2); }
  .kbd{
    font-family:var(--mono); font-size:10.5px; color:var(--muted-2);
    border:1px solid var(--line); border-radius:4px; padding:1px 5px;
  }
  .scope-select{
    background:var(--panel-2); border:1px solid var(--line); border-radius:9px;
    padding:8px 10px; font-size:12.5px; color:var(--muted); outline:none;
  }
  .count-pill{
    font-family:var(--mono); font-size:11.5px; color:var(--muted); white-space:nowrap;
  }
  .topbar-actions{ display:flex; align-items:center; gap:8px; margin-inline-start:auto; }
  .btn{
    display:flex; align-items:center; gap:6px;
    background:var(--panel-2); border:1px solid var(--line); color:var(--text);
    padding:8px 12px; border-radius:9px; font-size:12.5px; font-weight:600;
    transition:background .15s, border-color .15s;
  }
  .btn:hover{ border-color:var(--muted-2); }
  .btn.primary{ background:var(--accent); color:var(--btn-primary-text); border-color:var(--accent); }
  .btn.primary:hover{ background:var(--btn-primary-hover); }
  .btn.ghost{ background:none; }
  .btn svg{ flex-shrink:0; }

  /* ---------- Body layout ---------- */
  .body{ flex:1; display:flex; min-height:0; }

  /* ---------- Sidebar ---------- */
  .sidebar{
    width:270px; flex-shrink:0; border-inline-end:1px solid var(--line);
    background:var(--panel); overflow-y:auto; padding:14px 10px 24px; min-height:0;
    transition:background .15s ease, border-color .15s ease;
  }
  .sidebar-title{
    font-family:var(--mono); font-size:10.5px; letter-spacing:.8px; text-transform:uppercase;
    color:var(--muted-2); padding:4px 10px 10px;
  }
  .sec{ margin-bottom:2px; }
  .sec-head{
    display:flex; align-items:center; gap:8px; width:100%;
    background:none; border:none; color:var(--text); text-align:start;
    padding:8px 10px; border-radius:7px; font-size:12.8px; font-weight:600;
  }
  .sec-head:hover{ background:var(--panel-2); }
  .sec-head.active{ background:var(--panel-2); }
  .sec-stripe{ width:4px; height:16px; border-radius:2px; flex-shrink:0; background:var(--grey); }
  .sec-stripe.critical{ background:var(--red); }
  .sec-name{ flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .sec-count{ font-family:var(--mono); font-size:10.5px; color:var(--muted-2); }
  .chev{ transition:transform .15s; color:var(--muted-2); flex-shrink:0; }
  .chev.open{ transform:rotate(90deg); }
  .sub-list{ padding-inline-start:20px; }
  .sub-item{
    display:block; width:100%; text-align:start; background:none; border:none;
    color:var(--muted); font-size:12px; padding:6px 10px; border-radius:6px;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .sub-item:hover{ background:var(--panel-2); color:var(--text); }
  .sub-item.active{ background:var(--accent-dim); color:var(--accent-contrast); }

  .sidebar-foot{ padding:14px 10px 4px; border-top:1px solid var(--line); margin-top:12px; }
  .notes-btn{
    width:100%; display:flex; align-items:center; gap:8px; justify-content:center;
    padding:9px; border-radius:8px; border:1px dashed var(--line); background:none;
    color:var(--muted); font-size:12px; font-weight:600;
  }
  .notes-btn:hover{ border-color:var(--accent); color:var(--accent); }

  /* ---------- Main content ---------- */
  .main{ flex:1; overflow-y:auto; padding:18px 22px 40px; min-width:0; min-height:0; }
  .active-filters{ display:flex; gap:8px; align-items:center; margin-bottom:14px; flex-wrap:wrap; }
  .filter-chip{
    display:flex; align-items:center; gap:6px; background:var(--panel-2);
    border:1px solid var(--line); border-radius:20px; padding:5px 6px 5px 12px; font-size:12px;
  }
  .filter-chip button{ background:none; border:none; color:var(--muted); display:flex; padding:3px; border-radius:50%; }
  .filter-chip button:hover{ background:var(--line); color:var(--text); }

  .grid{
    display:grid; grid-template-columns:repeat(auto-fill, minmax(300px,1fr)); gap:12px;
  }
  .card{
    position:relative; background:var(--panel); border:1px solid var(--line);
    border-radius:var(--radius); padding:14px 14px 14px 18px; text-align:start;
    display:flex; flex-direction:column; gap:6px; overflow:hidden;
    transition:transform .12s, border-color .12s, background .12s;
  }
  .card:hover{ border-color:var(--muted-2); background:var(--panel-2); transform:translateY(-1px); }
  .card::before{
    content:""; position:absolute; inset-inline-start:0; top:0; bottom:0; width:4px; background:var(--grey);
  }
  .card.critical::before{ background:var(--red); }
  .card-top{ display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .card-tag{ font-family:var(--mono); font-size:10px; color:var(--muted-2); }
  .card-section{ font-size:10px; color:var(--muted-2); text-transform:uppercase; letter-spacing:.4px; }
  .card-title{ font-size:14.5px; font-weight:700; }
  .card-desc{ font-size:12px; color:var(--muted); overflow:hidden; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; }
  .card-match{ font-size:11.5px; color:var(--muted); margin-top:2px; }
  .card-match b{ color:var(--muted-2); font-weight:600; font-family:var(--mono); font-size:10px; text-transform:uppercase; margin-inline-end:6px;}
  mark{ background:var(--accent-dim); color:var(--accent-contrast); border-radius:2px; padding:0 1px; }

  .empty{
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding:80px 20px; color:var(--muted);
  }
  .empty h2{ color:var(--text); font-size:18px; margin:14px 0 6px; }
  .empty p{ max-width:420px; font-size:13px; margin:0 0 18px; }

  /* ---------- Detail drawer ---------- */
  .scrim{
    position:fixed; inset:0; background:rgba(8,10,13,.55); opacity:0; pointer-events:none;
    transition:opacity .18s; z-index:40;
  }
  .scrim.show{ opacity:1; pointer-events:auto; }
  .drawer{
    position:fixed; top:16px; bottom:16px; left:50%; width:min(640px, 94vw);
    background:var(--panel); border:1px solid var(--line); border-radius:14px;
    box-shadow:var(--shadow);
    transform:translate(-50%,8px) scale(.98); opacity:0; pointer-events:none;
    transition:transform .18s ease, opacity .18s ease; z-index:41;
    display:flex; flex-direction:column; overflow:hidden;
  }
  .drawer.show{ transform:translate(-50%,0) scale(1); opacity:1; pointer-events:auto; }
  .drawer-head{
    display:flex; align-items:flex-start; gap:10px; padding:16px 18px; border-bottom:1px solid var(--line);
    flex-shrink:0;
  }
  .drawer-stripe{ width:5px; align-self:stretch; border-radius:3px; background:var(--grey); flex-shrink:0; }
  .drawer-stripe.critical{ background:var(--red); }
  .drawer-head-text{ flex:1; min-width:0; }
  .drawer-eyebrow{ font-family:var(--mono); font-size:10.5px; color:var(--muted-2); text-transform:uppercase; letter-spacing:.5px; margin-bottom:4px; }
  .drawer-title{ font-size:17px; font-weight:800; }
  .drawer-desc{ font-size:12.5px; color:var(--muted); margin-top:6px; white-space:pre-wrap; }
  .drawer-close{ background:none; border:none; color:var(--muted); padding:6px; border-radius:6px; flex-shrink:0; }
  .drawer-close:hover{ background:var(--panel-2); color:var(--text); }
  .drawer-body{ flex:1; overflow-y:auto; padding:6px 18px 30px; }

  .fgroup{ margin-top:20px; }
  .fgroup-title{
    font-family:var(--mono); font-size:10.5px; text-transform:uppercase; letter-spacing:.6px;
    color:var(--accent); padding-bottom:6px; border-bottom:1px solid var(--line); margin-bottom:10px;
  }
  .field{ margin-bottom:16px; }
  .field-label-row{ display:flex; align-items:baseline; justify-content:space-between; gap:8px; margin-bottom:5px; }
  .field-label{ font-size:12px; font-weight:700; color:var(--text); }
  .field-label-ar{ font-size:11px; color:var(--muted-2); font-family:var(--arabic); }
  .copy-btn{
    display:flex; align-items:center; gap:4px; background:none; border:1px solid var(--line);
    color:var(--muted); font-size:10.5px; padding:3px 7px; border-radius:6px; flex-shrink:0;
  }
  .copy-btn:hover{ border-color:var(--accent); color:var(--accent); }
  .copy-btn.done{ border-color:var(--green); color:var(--green); }
  .field-value{
    background:var(--panel-2); border:1px solid var(--line); border-radius:8px;
    padding:10px 12px; font-size:12.8px; color:var(--text);
  }
  .field.is-highlighted .field-value{
    background:var(--refund-bg); border-color:var(--refund-border);
  }
  .field.is-highlighted .field-label{ color:var(--refund-label); }
  .field.is-highlighted-alt .field-value{
    position:relative; overflow:visible;
    background:var(--comp-bg); border-color:var(--comp-border);
    animation: comp-pulse 2.2s ease-in-out infinite;
  }
  .field.is-highlighted-alt .field-label{ color:var(--green); }
  @keyframes comp-pulse{
    0%{ box-shadow:0 0 0 0 var(--comp-glow); }
    70%{ box-shadow:0 0 0 10px rgba(0,0,0,0); }
    100%{ box-shadow:0 0 0 0 rgba(0,0,0,0); }
  }
  .comp-orbit-svg{
    position:absolute; top:-1px; left:-1px;
    width:calc(100% + 2px); height:calc(100% + 2px);
    pointer-events:none; z-index:2; overflow:visible;
  }
  .comp-orbit-rect{
    fill:none;
    stroke:var(--comp-comet); stroke-width:2.5px; stroke-linecap:round;
    stroke-dasharray:18 82; vector-effect:non-scaling-stroke;
    animation:comp-orbit-dash 3.6s linear infinite;
    filter:drop-shadow(0 0 3px var(--comp-comet));
  }
  @keyframes comp-orbit-dash{
    from{ stroke-dashoffset:0; }
    to{ stroke-dashoffset:-100; }
  }
  @keyframes comp-bounce{
    0%, 100%{ transform:translateY(0) scale(1) rotate(0deg); }
    25%{ transform:translateY(-4px) scale(1.12) rotate(-8deg); }
    50%{ transform:translateY(0) scale(1.05) rotate(0deg); }
    75%{ transform:translateY(-3px) scale(1.12) rotate(8deg); }
  }
  .comp-badge{
    display:inline-block; margin-inline-start:6px; font-size:15px;
    animation:comp-bounce 2.4s ease-in-out infinite;
  }
  .fval-line{ margin:0 0 6px; white-space:pre-wrap; }
  .fval-line:last-child{ margin-bottom:0; }
  .fval-line[dir="rtl"]{ font-family:var(--arabic); text-align:right; }

  /* ---------- Notes modal ---------- */
  .modal{
    position:fixed; inset:0; z-index:50; display:flex; align-items:center; justify-content:center;
    padding:30px; opacity:0; pointer-events:none; transition:opacity .18s;
  }
  .modal.show{ opacity:1; pointer-events:auto; }
  .modal-card{
    background:var(--panel); border:1px solid var(--line); border-radius:14px;
    width:min(680px,100%); max-height:85vh; display:flex; flex-direction:column;
  }
  .modal-head{ display:flex; align-items:center; padding:16px 20px; border-bottom:1px solid var(--line); gap:10px;}
  .modal-head h3{ margin:0; font-size:15px; }
  .modal-body{ overflow-y:auto; padding:16px 20px 24px; }
  .note-block{
    background:var(--panel-2); border:1px solid var(--line); border-radius:9px;
    padding:12px 14px; margin-bottom:12px; font-size:12.6px; white-space:pre-wrap;
  }

  /* ---------- Upload dropzone ---------- */
  .upload-zone{
    border:1.5px dashed var(--line); border-radius:12px; padding:22px;
    display:flex; flex-direction:column; align-items:center; gap:10px; color:var(--muted);
    max-width:420px;
  }
  .upload-zone.drag{ border-color:var(--accent); color:var(--accent); background:var(--panel-2); }
  .upload-alt-row{ display:flex; align-items:center; gap:10px; margin-top:4px; }
  .upload-alt-row .divider-word{ font-size:11px; color:var(--muted-2); text-transform:uppercase; letter-spacing:.5px; }
  .paste-textarea{
    width:100%; min-height:220px; resize:vertical;
    background:var(--panel-2); border:1px solid var(--line); border-radius:8px;
    color:var(--text); font-family:var(--mono); font-size:12px; line-height:1.5;
    padding:10px 12px; outline:none; white-space:pre; overflow:auto;
  }
  .paste-textarea:focus{ border-color:var(--accent); }
  .paste-preview{ font-size:12px; color:var(--muted); margin-top:8px; min-height:16px; }
  .paste-preview.ok{ color:var(--green); }
  .paste-preview.err{ color:var(--red); }
  .toast{
    position:fixed; bottom:20px; inset-inline-start:50%; transform:translateX(-50%) translateY(20px);
    background:var(--panel-2); border:1px solid var(--line); color:var(--text);
    padding:10px 16px; border-radius:9px; font-size:12.5px; z-index:60; opacity:0; pointer-events:none;
    transition:opacity .2s, transform .2s; display:flex; align-items:center; gap:8px;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }
  html[dir="rtl"] .toast{ transform:translate(50%, 20px); }
  html[dir="rtl"] .toast.show{ transform:translate(50%, 0); }

  .field-scope-tag{ font-size:11px; color:var(--muted-2); }

  @media (max-width: 860px){
    .sidebar{ position:fixed; top:57px; bottom:0; inset-inline-start:0; z-index:35; transform:translateX(-100%); transition:transform .2s; width:78vw; max-width:300px;}
    html[dir="rtl"] .sidebar{ transform:translateX(100%); }
    .sidebar.show{ transform:translateX(0); }
    .scope-select{ display:none; }
    .brand-text{ display:none; }
    .drawer{ top:0; bottom:0; left:0; right:0; width:100vw; transform:translateY(10px); border-radius:0; }
    .drawer.show{ transform:translateY(0); }
  }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
(function(){
"use strict";

/* ================= STATE ================= */
var state = {
  kb: null,               // {importantNotes, fieldOrder, records}
  query: "",
  scopeField: "ALL",      // "ALL" or a field key
  activeSection: null,
  activeComplaintType: null,
  expandedSections: {},
  openRecordId: null,
  notesOpen: false,
  sidebarOpen: false,
  theme: "light",
  pasteOpen: false,
};

var THEME_KEY = "kb-theme";


function loadStoredTheme(){
  try{
    var v = localStorage.getItem(THEME_KEY);
    if (v === "dark" || v === "light") return v;
  }catch(e){}
  return "light";
}
function applyTheme(theme){
  document.documentElement.setAttribute("data-theme", theme === "dark" ? "dark" : "light");
}
function toggleTheme(){
  state.theme = (state.theme === "dark") ? "light" : "dark";
  applyTheme(state.theme);
  try{ localStorage.setItem(THEME_KEY, state.theme); }catch(e){}
  render();
}

/* ================= UTIL ================= */
function esc(s){
  return String(s).replace(/[&<>"']/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
  });
}
function stripDiacritics(s){
  return String(s).replace(/[\u064B-\u0652\u0670\u0640]/g, "");
}
function normalize(s){
  return stripDiacritics(String(s).toLowerCase());
}
function splitHeader(key){
  var parts = String(key).split(/\r?\n/).filter(Boolean);
  return { en: parts[0] || key, ar: parts[1] || "" };
}
function isRTLText(s){
  return /[\u0600-\u06FF]/.test(s);
}
function fieldWeight(key){
  var k = key.toLowerCase();
  if (k.indexOf("complaint type") !== -1) return 6;
  if (k.indexOf("category") !== -1) return 5;
  if (k.indexOf("description") !== -1) return 4;
  if (k.indexOf("chat label") !== -1) return 3;
  return 1;
}
function fieldByKey(key){
  var f = state.kb.fieldOrder.find(function(f){ return f.key === key; });
  return f;
}
function recordDisplayTitle(rec){
  var ct = fieldValue(rec, "Complaint Type");
  if (ct) return ct;
  var cat = fieldValue(rec, "Category");
  return cat || ("Case #" + rec._row);
}
function fieldValue(rec, partialKey){
  var keys = Object.keys(rec.fields);
  for (var i=0;i<keys.length;i++){
    if (keys[i].toLowerCase().indexOf(partialKey.toLowerCase()) === 0) return rec.fields[keys[i]];
  }
  return "";
}
function isCritical(section){
  return /critical/i.test(section || "");
}
function saveToast(msg){
  var t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");

}

/* Cell helpers: Excel pastes give "" for empty cells, short rows give undefined,
   xlsx files give null. Treat all of them (and whitespace / nbsp) as empty. */
function cellStr(v){
  if (v === null || v === undefined) return "";
  return String(v).replace(/\u00a0/g, " ").trim();
}

/* Cleans a raw grid so a whole-sheet copy behaves like an exact-range copy:
   - every cell becomes a string
   - fully empty rows at the top/bottom are dropped
   - fully empty columns on the left/right are dropped
   - short rows are padded to the same width */
function normalizeGrid(rows){
  var grid = rows.map(function(r){ return (r || []).map(function(c){ return c === null || c === undefined ? "" : String(c); }); });
  function rowEmpty(r){ return r.every(function(c){ return cellStr(c) === ""; }); }
  while (grid.length && rowEmpty(grid[grid.length-1])) grid.pop();
  var top = 0;
  while (top < grid.length && rowEmpty(grid[top])) top++;
  grid = grid.slice(top);
  if (!grid.length) return [];
  var minCol = Infinity, maxCol = -1;
  grid.forEach(function(r){
    for (var i=0;i<r.length;i++){
      if (cellStr(r[i]) !== ""){ if (i < minCol) minCol = i; if (i > maxCol) maxCol = i; }
    }
  });
  if (maxCol < 0) return [];
  return grid.map(function(r){
    var out = [];
    for (var i=minCol;i<=maxCol;i++) out.push(r[i] === undefined ? "" : r[i]);
    return out;
  });
}

/* ================= PARSING ================= */
function parseWorkbookRows(rawRows){
  var rows = normalizeGrid(rawRows);

  // Locate the header row by content ("Complaint Type") instead of a fixed
  // position, so blank rows above it (or a different layout) don't break import.
  var hdrIdx = -1;
  for (var h=0; h<Math.min(rows.length, 20) && hdrIdx<0; h++){
    for (var c=0;c<rows[h].length;c++){
      if (/complaint\s*type/i.test(cellStr(rows[h][c]))){ hdrIdx = h; break; }
    }
  }
  if (hdrIdx < 0) hdrIdx = Math.min(2, Math.max(rows.length-1, 0));

  var groupRow = hdrIdx >= 1 ? rows[hdrIdx-1] : [];
  var importantNotes = [];
  for (var n=0; n<=hdrIdx-2; n++){
    var nr = rows[n] || [];
    if (nr.some(function(x){ return cellStr(x) !== ""; })){
      importantNotes = nr.slice(1).map(cellStr).filter(Boolean);
      break;
    }
  }

  var groupForCol = [];
  var lastGroup = "";
  var i;
  for (i=0;i<groupRow.length;i++){
    if (cellStr(groupRow[i]) !== "") lastGroup = cellStr(groupRow[i]);
    groupForCol[i] = lastGroup;
  }

  var headerRow = rows[hdrIdx] || [];
  var numCols = headerRow.length;
  var fieldForCol = [];
  var lastField = "";
  for (i=0;i<numCols;i++){
    if (cellStr(headerRow[i]) !== "") lastField = cellStr(headerRow[i]);
    fieldForCol[i] = lastField;
  }

  var fieldOrder = [];
  var seen = {};
  for (i=0;i<numCols;i++){
    var f = fieldForCol[i];
    if (!f) continue;
    if (!seen[f]){
      seen[f] = true;
      fieldOrder.push({ key:f, group: groupForCol[i] || "", cols:[i] });
    } else {
      var entry = fieldOrder.filter(function(e){ return e.key===f; })[0];
      if (entry) entry.cols.push(i);
    }
  }

  var records = [];
  var currentSection = "";
  for (var r=hdrIdx+1;r<rows.length;r++){
    var row = rows[r] || [];
    if (row.every(function(x){ return cellStr(x) === ""; })) continue;
    var col0 = cellStr(row[0]);
    var col1 = cellStr(row[1]);
    // A category/section divider row has a category name in col0 but no
    // Complaint Type in col1.
    if (col0 && !col1){ currentSection = col0; continue; }
    var record = { _section: currentSection, _row: r+1, fields:{} };
    for (var fi=0; fi<fieldOrder.length; fi++){
      var fo = fieldOrder[fi];
      var vals = fo.cols.map(function(ci){ return cellStr(row[ci]); }).filter(Boolean);
      if (vals.length) record.fields[fo.key] = vals.join("\n\n");
    }
    if (Object.keys(record.fields).length) records.push(record);
  }
  return { importantNotes: importantNotes, fieldOrder: fieldOrder, records: records };
}

function applyParsedKB(parsed, sourceLabel){
  if (!parsed.records.length){
    saveToast("No rows found — check the data includes the category/header rows, not just case rows.");
    return false;
  }
  state.kb = parsed;
  state.query=""; state.scopeField="ALL"; state.activeSection=null; state.activeComplaintType=null;
  state.expandedSections = {}; state.openRecordId = null;
  render();
  saveToast("Imported " + parsed.records.length + " cases from " + sourceLabel);
  return true;
}

function parseFile(file){
  var reader = new FileReader();
  reader.onload = function(e){
    try{
      var data = new Uint8Array(e.target.result);
      var wb = XLSX.read(data, { type:"array" });
      var best = null;
      wb.SheetNames.forEach(function(name){
        var rows = XLSX.utils.sheet_to_json(wb.Sheets[name], { header:1, defval:null, raw:false });
        var p = parseWorkbookRows(rows);
        if (!best || p.records.length > best.records.length) best = p;
      });
      applyParsedKB(best, file.name);
    } catch(err){
      console.error(err);
      saveToast("Couldn't read that file. Make sure it's a .xlsx export of the KB.");
    }
  };
  reader.readAsArrayBuffer(file);
}

// Parses text copied out of Excel / Google Sheets (tab-separated). A cell is
// wrapped in double quotes when it contains a tab, newline or quote; doubled
// quotes ("") are a literal quote. Quotes only open a quoted cell at the START
// of a cell, so stray quotes inside normal text are kept as-is.
function detectDelimiter(text){
  var sample = text.slice(0, 5000);
  if (sample.indexOf("\t") !== -1) return "\t";
  var firstLine = sample.split(/\r?\n/)[0] || "";
  var semi = (firstLine.match(/;/g) || []).length;
  var comma = (firstLine.match(/,/g) || []).length;
  if (semi > 1 && semi >= comma) return ";";
  if (comma > 1) return ",";
  return "\t";
}
function parseDelimitedText(text, delimiter){
  delimiter = delimiter || detectDelimiter(text);
  text = text.replace(/^\uFEFF/, "");
  var rows = [], row = [], field = "", inQuotes = false, atFieldStart = true;
  var i = 0, len = text.length;
  while (i < len){
    var c = text[i];
    if (inQuotes){
      if (c === '"'){
        if (text[i+1] === '"'){ field += '"'; i += 2; continue; }
        inQuotes = false; i++; continue;
      }
      field += c; i++; continue;
    }
    if (c === '"' && atFieldStart){ inQuotes = true; atFieldStart = false; i++; continue; }
    if (c === delimiter){ row.push(field); field = ""; atFieldStart = true; i++; continue; }
    if (c === "\r"){ i++; continue; }
    if (c === "\n"){ row.push(field); rows.push(row); row = []; field = ""; atFieldStart = true; i++; continue; }
    field += c; atFieldStart = false; i++;
  }
  row.push(field);
  rows.push(row);
  return rows;
}

function parsePastedText(text){
  try{
    var parsed = parseWorkbookRows(parseDelimitedText(text));
    return applyParsedKB(parsed, "pasted data");
  } catch(err){
    console.error(err);
    saveToast("Couldn't read that pasted data. Make sure you copied the full range, including the header rows.");
    return false;
  }
}

/* ================= SEARCH ================= */
function searchRecords(){
  var recs = state.kb ? state.kb.records : [];
  var q = normalize(state.query.trim());

  var filtered = recs.filter(function(rec){
    if (state.activeSection && rec._section !== state.activeSection) return false;
    if (state.activeComplaintType && fieldValue(rec,"Complaint Type") !== state.activeComplaintType) return false;
    return true;
  });

  if (!q){
    return filtered.map(function(rec){ return { rec: rec, score:0, matchKey:null, snippet:null }; });
  }

  var scopeKey = scopeKeyResolved();
  var results = [];
  filtered.forEach(function(rec){
    var bestScore = 0, bestKey = null, bestIdx = -1;
    Object.keys(rec.fields).forEach(function(key){
      if (scopeKey && key !== scopeKey) return;
      var raw = rec.fields[key];
      var norm = normalize(raw);
      var idx = norm.indexOf(q);
      if (idx === -1) return;
      var occurrences = norm.split(q).length - 1;
      var score = fieldWeight(key) * (1 + Math.min(occurrences,5)*0.15);
      if (score > bestScore){ bestScore = score; bestKey = key; bestIdx = idx; }
      else if (!bestKey){ bestScore = Math.max(bestScore, score); }
    });
    if (bestKey){
      var raw = rec.fields[bestKey];
      var start = Math.max(0, bestIdx-40);
      var end = Math.min(raw.length, bestIdx+q.length+60);
      var snippet = (start>0?"…":"") + raw.slice(start,end).replace(/\s+/g," ") + (end<raw.length?"…":"");
      results.push({ rec: rec, score: bestScore, matchKey: bestKey, snippet: snippet });
    }
  });
  results.sort(function(a,b){ return b.score - a.score; });
  return results;
}

function highlight(text, q){
  if (!q) return esc(text);
  var norm = normalize(text);
  var nq = normalize(q);
  var out = "", i=0;
  while(true){
    var idx = norm.indexOf(nq, i);
    if (idx===-1){ out += esc(text.slice(i)); break; }
    out += esc(text.slice(i,idx)) + "<mark>" + esc(text.slice(idx, idx+nq.length)) + "</mark>";
    i = idx+nq.length;
  }
  return out;
}

  });
  return order;

  var seen = {}; var out = [];

function renderDrawer(){
  var openId = state.openRecordId;
  if (!state.kb || openId==null) return '<div class="drawer" id="drawer"></div>';
  var rec = state.kb.records.filter(function(r){ return r._row === openId; })[0];
  if (!rec) return '<div class="drawer" id="drawer"></div>';

  var crit = isCritical(rec._section);
  var title = recordDisplayTitle(rec);
  var desc = fieldValue(rec,"Description");

  var html = '<div class="drawer show" id="drawer">';
  html += '<div class="drawer-head">'+
    '<div class="drawer-stripe '+(crit?'critical':'')+'"></div>'+
    '<div class="drawer-head-text">'+
      '<div class="drawer-eyebrow">'+esc(rec._section)+' · Case #'+String(rec._row).padStart(3,'0')+'</div>'+
      '<div class="drawer-title">'+esc(title)+'</div>'+
      (desc ? '<div class="drawer-desc" dir="auto">'+esc(desc)+'</div>' : '')+
    '</div>'+
    '<button class="drawer-close" id="drawerClose"><svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>'+
  '</div>';
  html += '<div class="drawer-body">';

  var orderedFields = state.kb.fieldOrder.filter(function(f){
    var k = f.key.toLowerCase();
    return k.indexOf("complaint type")!==0 && k.indexOf("category")!==0 && k.indexOf("description")!==0;
  });
  // Fixed display order after "CST Required Info", identified by header name (not
  // column position) so this stays correct no matter how columns are ordered,
  // added, or removed in the source file:
  //   Refund Needed -> Compensation Needed -> Product Image -> Cost Accountability
  //   -> Chat Label -> Ticket Tree -> (everything else, in its original order)
  var priorityPatterns = [
    /^refund needed/i,
    /^compensation needed/i,
    /^product image/i,
    /^cost accountability/i,
    /^chat label/i,
    /^ticket tree/i
  ];
  var priorityKeys = [];
  priorityPatterns.forEach(function(re){
    var match = orderedFields.filter(function(f){ return re.test(f.key); })[0];
    if (match) priorityKeys.push(match);
  });
  orderedFields = orderedFields.filter(function(f){ return priorityKeys.indexOf(f) === -1; });
  var cstIdx = orderedFields.findIndex(function(f){ return /^cst required info/i.test(f.key); });
  var insertAt = cstIdx + 1;
  orderedFields.splice.apply(orderedFields, [insertAt, 0].concat(priorityKeys));

  var visibleFields = orderedFields.filter(function(f){ return rec.fields[f.key]; });

  var lastGroup = null;
  var groupOpen = false;
  visibleFields.forEach(function(f){
    if (f.group !== lastGroup){
      if (groupOpen) html += '</div>';
      html += '<div class="fgroup"><div class="fgroup-title">'+esc(f.group||'Other')+'</div>';
      groupOpen = true;
      lastGroup = f.group;
    }
    var h = splitHeader(f.key);
    var val = rec.fields[f.key];
    var copyable = /script|ticket|note/i.test(h.en);
    var highlighted = /^refund needed/i.test(h.en);
    var highlightedAlt = /^compensation needed/i.test(h.en);
    var fidx = state.kb.fieldOrder.indexOf(f);
    html += '<div class="field '+(highlighted?'is-highlighted':'')+(highlightedAlt?'is-highlighted-alt':'')+'">'+
      '<div class="field-label-row"><div><span class="field-label">'+esc(h.en)+'</span>'+
        (highlightedAlt?' <span class="comp-badge" aria-hidden="true">🎁</span>':'')+
        (h.ar?' <span class="field-label-ar">'+esc(h.ar)+'</span>':'')+'</div>'+
        (copyable?'<button class="copy-btn" data-copy-idx="'+fidx+'">Copy</button>':'')+
      '</div>'+
      '<div class="field-value"'+(highlightedAlt?' style="position:relative;overflow:visible;"':'')+'>'+
        (highlightedAlt?'<svg class="comp-orbit-svg" aria-hidden="true"><rect class="comp-orbit-rect" x="0" y="0" width="100%" height="100%" rx="9" pathLength="100"/></svg>':'')+
        val.split(/\n\n+/).map(function(line){
          var rtl = isRTLText(line);
          return '<p class="fval-line" dir="'+(rtl?'rtl':'auto')+'">'+esc(line)+'</p>';
        }).join('')+
      '</div>'+
    '</div>';
  });
  if (groupOpen) html += '</div>';

  html += '</div></div>';
  return html;
}

function renderNotesModal(){
  if (!state.kb) return '<div class="modal" id="notesModal"></div>';
  var html = '<div class="modal '+(state.notesOpen?'show':'')+'" id="notesModal">'+
    '<div class="modal-card">'+
      '<div class="modal-head"><h3>💡 Important Notes</h3>'+
        '<button class="drawer-close" id="notesClose" style="margin-inline-start:auto;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>'+
      '</div>'+
      '<div class="modal-body">'+
        state.kb.importantNotes.map(function(n){
          var rtl = isRTLText(n);
          return '<div class="note-block" dir="'+(rtl?'rtl':'auto')+'">'+esc(n)+'</div>';
        }).join('')+
      '</div>'+
    '</div>'+
  '</div>';
  return html;
}

function renderPasteModal(){
  var html = '<div class="modal '+(state.pasteOpen?'show':'')+'" id="pasteModal">'+
    '<div class="modal-card" style="width:min(720px,100%);">'+
      '<div class="modal-head"><h3>Paste KB data from Excel</h3>'+
        '<button class="drawer-close" id="pasteClose" style="margin-inline-start:auto;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>'+
      '</div>'+
      '<div class="modal-body">'+
        '<p style="font-size:12.5px;color:var(--muted);margin:0 0 10px;">Copy your cells in Excel (Ctrl+C) — the whole sheet is fine, empty cells are ignored — then paste here (Ctrl+V). It imports automatically. You can also press Ctrl+V anywhere on the page without opening this window.</p>'+
        '<textarea id="pasteArea" class="paste-textarea" placeholder="Click here and paste (Ctrl+V)…"></textarea>'+
        '<div id="pastePreview" class="paste-preview"></div>'+
        '<div style="display:flex; gap:8px; justify-content:flex-end; margin-top:14px;">'+
          '<button class="btn ghost" id="pasteCancel">Cancel</button>'+
          '<button class="btn primary" id="pasteConfirm" disabled>Import pasted data</button>'+
        '</div>'+
      '</div>'+
    '</div>'+
  '</div>';
  return html;
}

/* ================= EVENTS ================= */
function bindEvents(){
  var searchInput = document.getElementById("searchInput");
  if (searchInput){
    searchInput.addEventListener("input", function(e){
      state.query = e.target.value;
      render();
      var el = document.getElementById("searchInput");
      if (el){ el.focus(); el.selectionStart = el.selectionEnd = el.value.length; }
    });
    var searchBoxEl = searchInput.closest(".search-box");
    if (searchBoxEl){
      searchBoxEl.addEventListener("mousedown", function(e){
        if (e.target !== searchInput) e.preventDefault();
      });
      searchBoxEl.addEventListener("click", function(){ searchInput.focus(); });
    }
  }
  var clearSearch = document.getElementById("clearSearch");
  if (clearSearch) clearSearch.addEventListener("click", function(){ state.query=""; render(); });

  var scopeSelect = document.getElementById("scopeSelect");
  if (scopeSelect) scopeSelect.addEventListener("change", function(e){ state.scopeField = e.target.value; render(); });

  var importBtn = document.getElementById("importBtn");
  var importBtn2 = document.getElementById("importBtn2");
  var fileInput = document.getElementById("fileInput");
  [importBtn, importBtn2].forEach(function(b){ if (b) b.addEventListener("click", function(){ fileInput.click(); }); });
  fileInput.addEventListener("change", function(e){
    if (e.target.files && e.target.files[0]) parseFile(e.target.files[0]);
    fileInput.value = "";
  });

  var dropzone = document.getElementById("dropzone");
  if (dropzone){
    ["dragenter","dragover"].forEach(function(ev){
      dropzone.addEventListener(ev, function(e){ e.preventDefault(); dropzone.classList.add("drag"); });
    });
    ["dragleave","drop"].forEach(function(ev){
      dropzone.addEventListener(ev, function(e){ e.preventDefault(); dropzone.classList.remove("drag"); });
    });
  }

  document.querySelectorAll("[data-sec]").forEach(function(btn){
    btn.addEventListener("click", function(){
      var sec = btn.getAttribute("data-sec");
      var ct = btn.getAttribute("data-ct");
      if (ct){
        state.activeSection = sec;
        state.activeComplaintType = (state.activeComplaintType===ct ? null : ct);
      } else {
        state.expandedSections[sec] = !state.expandedSections[sec];
        if (state.activeSection === sec && !state.activeComplaintType){
          state.activeSection = null;
        } else {
          state.activeSection = sec;
          state.activeComplaintType = null;
        }
      }
      render();
    });
  });

  document.querySelectorAll("[data-clearchip]").forEach(function(btn){
    btn.addEventListener("click", function(){
      var key = btn.getAttribute("data-clearchip");
      if (key==="section"){ state.activeSection=null; state.activeComplaintType=null; }
      if (key==="ct"){ state.activeComplaintType=null; }
      render();
    });
  });

  document.querySelectorAll("[data-open]").forEach(function(btn){
    btn.addEventListener("click", function(){
      state.openRecordId = parseInt(btn.getAttribute("data-id"),10);
      render();
      var scrim = document.getElementById("scrim");
      if (scrim) scrim.classList.add("show");
    });
  });

  var drawerClose = document.getElementById("drawerClose");
  if (drawerClose) drawerClose.addEventListener("click", closeDrawer);
  var scrim = document.getElementById("scrim");
  if (scrim) scrim.addEventListener("click", function(){ closeDrawer(); closeNotes(); closePasteModal(); });

  document.querySelectorAll("[data-copy-idx]").forEach(function(btn){
    btn.addEventListener("click", function(){
      var fidx = parseInt(btn.getAttribute("data-copy-idx"), 10);
      var fo = state.kb.fieldOrder[fidx];
      var rec = state.kb.records.filter(function(r){ return r._row===state.openRecordId; })[0];
      if (!rec || !fo) return;
      var text = rec.fields[fo.key] || "";
      navigator.clipboard.writeText(text).then(function(){
        btn.textContent = "Copied"; btn.classList.add("done");
        setTimeout(function(){ btn.textContent="Copy"; btn.classList.remove("done"); }, 1500);
      }).catch(function(){ saveToast("Couldn't copy — select the text manually."); });
    });
  });

  var notesBtn = document.getElementById("notesBtn");
  var notesBtnSide = document.getElementById("notesBtnSide");
  [notesBtn, notesBtnSide].forEach(function(b){ if (b) b.addEventListener("click", openNotes); });
  var notesClose = document.getElementById("notesClose");
  if (notesClose) notesClose.addEventListener("click", closeNotes);
  var notesModalEl = document.getElementById("notesModal");
  if (notesModalEl) notesModalEl.addEventListener("click", function(e){ if (e.target === notesModalEl) closeNotes(); });

  var pasteBtn = document.getElementById("pasteBtn");
  var pasteBtn2 = document.getElementById("pasteBtn2");
  [pasteBtn, pasteBtn2].forEach(function(b){ if (b) b.addEventListener("click", pasteFromClipboardButton); });
  var pasteClose = document.getElementById("pasteClose");
  if (pasteClose) pasteClose.addEventListener("click", closePasteModal);
  var pasteCancel = document.getElementById("pasteCancel");
  if (pasteCancel) pasteCancel.addEventListener("click", closePasteModal);
  var pasteModalEl = document.getElementById("pasteModal");
  if (pasteModalEl) pasteModalEl.addEventListener("click", function(e){ if (e.target === pasteModalEl) closePasteModal(); });
  var pasteArea = document.getElementById("pasteArea");
  var pastePreview = document.getElementById("pastePreview");
  var pasteConfirm = document.getElementById("pasteConfirm");
  var lastPastedText = "";
  if (pasteArea){
    pasteArea.addEventListener("input", function(){
      lastPastedText = pasteArea.value;
      if (!lastPastedText.trim()){
        pastePreview.textContent = "";
        pastePreview.className = "paste-preview";
        pasteConfirm.disabled = true;
        return;
      }
      try{
        var rows = parseDelimitedText(lastPastedText);
        var parsed = parseWorkbookRows(rows);
        if (parsed.records.length){
          var sectionCount = {};
          parsed.records.forEach(function(r){ sectionCount[r._section]=1; });
          pastePreview.textContent = "Detected " + parsed.records.length + " cases across " + Object.keys(sectionCount).length + " categories.";
          pastePreview.className = "paste-preview ok";
          pasteConfirm.disabled = false;
        } else {
          pastePreview.textContent = "No cases detected — make sure you copied the category and header rows too, not just the case rows.";
          pastePreview.className = "paste-preview err";
          pasteConfirm.disabled = true;
        }
      } catch(err){
        pastePreview.textContent = "Couldn't parse that data yet.";
        pastePreview.className = "paste-preview err";
        pasteConfirm.disabled = true;
      }
    });
  }
  if (pasteConfirm){
    pasteConfirm.addEventListener("click", function(){
      if (parsePastedText(lastPastedText)) closePasteModal();
    });
  }

  var themeBtn = document.getElementById("themeBtn");
  if (themeBtn) themeBtn.addEventListener("click", toggleTheme);

  var hamburgerBtn = document.getElementById("hamburgerBtn");
  if (hamburgerBtn) hamburgerBtn.addEventListener("click", function(){
    document.getElementById("sidebar").classList.toggle("show");
  });
  if (window.innerWidth <= 860 && hamburgerBtn) hamburgerBtn.style.display = "flex";

  document.addEventListener("keydown", escHandler);
}


function escHandler(e){
  if (e.key === "Escape"){ closeDrawer(); closeNotes(); closePasteModal(); }
}
function closeDrawer(){
  state.openRecordId = null;
  var d = document.getElementById("drawer");
  if (d) d.classList.remove("show");
  var s = document.getElementById("scrim");
  if (s && !state.notesOpen && !state.pasteOpen) s.classList.remove("show");
  render();
}
function openNotes(){
  state.notesOpen = true; render();
  document.getElementById("scrim").classList.add("show");
}
function closeNotes(){
  state.notesOpen = false;
  var m = document.getElementById("notesModal");
  if (m) m.classList.remove("show");
  var s = document.getElementById("scrim");
  if (s && state.openRecordId==null && !state.pasteOpen) s.classList.remove("show");
  render();
}
function isEditableTarget(el){
  if (!el) return false;
  var tag = (el.tagName || "").toLowerCase();
  return tag === "input" || tag === "textarea" || tag === "select" || el.isContentEditable;
}
function handlePasteEvent(e){
  var el = e.target;
  var inModalArea = el && el.id === "pasteArea";
  if (isEditableTarget(el) && !inModalArea) return; // normal paste into the search box
  var cd = e.clipboardData || window.clipboardData;
  var text = cd ? cd.getData("text/plain") || cd.getData("Text") : "";
  if (!text || !text.trim()) return;
  e.preventDefault();
  if (parsePastedText(text) && state.pasteOpen) closePasteModal();
}
function pasteFromClipboardButton(){
  if (navigator.clipboard && navigator.clipboard.readText){
    navigator.clipboard.readText().then(function(text){
      if (text && text.trim()){ parsePastedText(text); }
      else { saveToast("Clipboard is empty — copy your Excel cells first, or press Ctrl+V."); }
    }).catch(function(){ openPasteModal(); });
  } else {
    openPasteModal();
  }
}
function openPasteModal(){
  state.pasteOpen = true; render();
  document.getElementById("scrim").classList.add("show");
  var ta = document.getElementById("pasteArea");
  if (ta) ta.focus();
}
function closePasteModal(){
  state.pasteOpen = false;
  var m = document.getElementById("pasteModal");
  if (m) m.classList.remove("show");
  var s = document.getElementById("scrim");
  if (s && state.openRecordId==null && !state.notesOpen) s.classList.remove("show");
  render();
}

/* ================= INIT ================= */
function init(){
  document.addEventListener("paste", handlePasteEvent);
  window.addEventListener("dragover", function(e){ e.preventDefault(); });
  window.addEventListener("drop", function(e){
    e.preventDefault();
    var f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
    if (f) parseFile(f);
  });
  state.kb = null;
  state.theme = loadStoredTheme();
  applyTheme(state.theme);
  render();
}
init();
})();

</script>
